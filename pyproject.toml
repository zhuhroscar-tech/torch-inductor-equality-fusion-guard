[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-inductor-equality-fusion-guard"
version = "0.1.0"
description = "Guards a real torch.compile Inductor bug: fusing a low-precision (bf16) division into a following exact equality/argmax-style comparison skips re-materializing the intermediate dtype's rounding boundary, silently finding fewer ties than eager and producing downstream Inf (pytorch/pytorch#195214)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "zhuhroscar-tech" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "numpy"]
torch = ["torch>=2.2", "numpy"]

[project.scripts]
torch-inductor-equality-fusion-guard = "torch_inductor_equality_fusion_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
